<svg width="1200" height="720" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Guardian Watch demo preview">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="70" y="60" width="1060" height="600" rx="26" fill="url(#card)"/>
  <text x="110" y="125" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700" fill="#0f172a">Guardian Watch</text>
  <rect x="110" y="160" width="410" height="360" rx="18" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="138" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155">Elder profile</text>
  <text x="138" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#475569">Daily routine</text>
  <text x="138" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#475569">Medications</text>
  <text x="138" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#475569">Mobility</text>
  <text x="138" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#475569">Home factors</text>
  <text x="138" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#475569">Behavioral changes</text>
  <text x="138" y="390" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#475569">Recent falls</text>

  <rect x="585" y="160" width="500" height="360" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="620" y="195" width="170" height="44" rx="22" fill="#f59e0b"/>
  <text x="675" y="223" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">REVIEW</text>
  <text x="620" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">3 related concerns detected</text>
  <text x="620" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">• Mobility change</text>
  <text x="620" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">• Dizziness reported</text>
  <text x="620" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">• New medication</text>
  <text x="620" y="430" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#334155">Medication review with clinician or pharmacist is recommended.</text>

  <text x="110" y="575" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#475569">Screen for patterns, not diagnoses.</text>
</svg>
